[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbc"
version = "0.1.0"
description = "Python in, fab-ready KiCad out"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Riley McCarthy" }]
keywords = ["pcb", "kicad", "compiler", "placement", "routing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
source = ["easyeda2kicad"]

[project.scripts]
pcbc = "pcbc.cli:main"

[project.urls]
Homepage = "https://github.com/RileyMcCarthy/pcbc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcbc = ["share/footprints/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
  "kicad: needs kicad-cli (Gerbers / DRC / POS)",
]
