name: test
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not kicad"

  blinky-fab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad 10 CLI
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad
          kicad-cli version
          kicad-cli version | grep -q '^10\.' || { echo "need KiCad 10.x"; exit 1; }
      - run: pip install -e ".[dev]"
      - name: Unit tests including kicad
        run: pytest -q --tb=short
        env:
          PCBC_REQUIRE_KICAD: "1"
      - name: Produce blinky KiCad project + JLC package
        run: |
          pcbc check examples/blinky/blinky.py --constraints
          pcbc build examples/blinky/blinky.py --force
          test -f examples/blinky/layout/blinky/routed/layout.kicad_pcb
          test -f examples/blinky/layout/blinky/routed/layout.gen.py
          test -f examples/blinky/layout/blinky/schematic.kicad_sch
          test -f examples/blinky/layout/blinky/fab/bom.csv
          test -d examples/blinky/layout/blinky/fab/gerbers
          grep -q C21190 examples/blinky/layout/blinky/fab/bom.csv
      - name: c3_usb check + place + review + route (N0 native router leaves VBUS open at J1)
        run: |
          pcbc check examples/c3_usb/c3_usb.py --constraints
          pcbc pcb examples/c3_usb/c3_usb.py
          test -f examples/c3_usb/layout/c3_usb/placed/layout.kicad_pcb
          test -f examples/c3_usb/layout/c3_usb/schematic.kicad_sch
          grep -q USB_DP examples/c3_usb/layout/c3_usb/schematic.kicad_sch
          pcbc review examples/c3_usb/c3_usb.py --no-open
          test -f examples/c3_usb/layout/c3_usb/review/index.html
          # N0: the build emits and gates the board, then stops on the unrouted net with its problem
          # files and writes no fab package. When it finishes, this step fails and must be updated.
          if pcbc build examples/c3_usb/c3_usb.py --force; then echo "c3_usb now routes: restore the fab checks"; exit 1; fi
          test -f examples/c3_usb/layout/c3_usb/routed/layout.kicad_pcb
          test -f examples/c3_usb/layout/c3_usb/routed/unrouted/VBUS-1.json
          test ! -e examples/c3_usb/layout/c3_usb/fab/bom.csv
      - name: buck schematic + copper (2 layers, switch node on one layer)
        run: |
          pcbc check examples/buck/buck.py --constraints
          pcbc sch examples/buck/buck.py
          pcbc build examples/buck/buck.py --force
          test -f examples/buck/layout/buck/fab/bom.csv
      - name: node schematic + copper (31 parts, 4 layers, planes; N0 leaves VBUS open at J1)
        run: |
          pcbc check examples/node/node.py --constraints
          pcbc sch examples/node/node.py
          pcbc pcb examples/node/node.py
          if pcbc build examples/node/node.py --force; then echo "node now routes: restore the fab check"; exit 1; fi
          test -f examples/node/layout/node/routed/layout.kicad_pcb
          test -f examples/node/layout/node/routed/unrouted/VBUS-1.json
      - uses: actions/upload-artifact@v4
        with:
          name: blinky-fab
          path: |
            examples/blinky/layout/blinky/schematic.kicad_sch
            examples/blinky/layout/blinky/routed/layout.kicad_pcb
            examples/blinky/layout/blinky/routed/layout.kicad_pro
            examples/blinky/layout/blinky/routed/layout.gen.py
            examples/blinky/layout/blinky/fab/gerbers
            examples/blinky/layout/blinky/fab/bom.csv
            examples/blinky/layout/blinky/fab/cpl.csv
            examples/blinky/layout/blinky/fab/FAB_NOTES.md
            examples/blinky/layout/blinky/fab/*.drl
      - uses: actions/upload-artifact@v4
        with:
          name: c3_usb-review
          path: |
            examples/c3_usb/layout/c3_usb/schematic.kicad_sch
            examples/c3_usb/layout/c3_usb/routed/layout.kicad_pcb
            examples/c3_usb/layout/c3_usb/routed/layout.gen.py
            examples/c3_usb/layout/c3_usb/routed/unrouted/*.json
            examples/c3_usb/layout/c3_usb/review/index.html
            examples/c3_usb/layout/c3_usb/review/board.glb
            examples/c3_usb/layout/c3_usb/review/*.svg
